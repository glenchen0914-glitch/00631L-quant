name: Daily 00631L V6.0 Final

on:
  workflow_dispatch:
  schedule:
    # 台灣時間週一至週五 07:30 = UTC 前一天 23:30（週日至週四）
    - cron: '30 23 * * 0-4'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Offline smoke test
        run: python tests/test_smoke.py

      - name: Final scenario tests
        run: python tests/test_final.py

      - name: Full optimizer test
        run: python tests/test_optimize_full.py

      - name: Run pipeline
        run: python run_pipeline.py

      - name: Commit daily reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/strategy_leaderboard.csv
          git add -f reports/daily_decision.json
          git add -f reports/dashboard.html
          git add -f reports/wave_tracking.csv
          git commit -m "Daily 00631L report" || exit 0
          git push