name: Daily 00631L Report

on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * 1-5'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python run_pipeline.py
      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data/market.db data/features.parquet || true
          git commit -m "Daily 00631L report" || exit 0
          git push