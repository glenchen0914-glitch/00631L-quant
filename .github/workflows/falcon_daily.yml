name: Falcon Daily
on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1-5"
      timezone: "Asia/Taipei"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python main.py
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      - name: Commit journal
        run: |
          git config user.name falcon-bot
          git config user.email falcon-bot@users.noreply.github.com
          git add reports/ data/falcon.db || true
          git diff --cached --quiet || git commit -m "chore: daily Falcon report"
          git push
