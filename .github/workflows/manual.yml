name: 00631L + 00981A Manual Run

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manual:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python tests/test_smoke.py
      - name: Run and notify
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LINE_PUSH_REQUIRED: 'false'
        run: python run_dual.py
      - uses: actions/upload-artifact@v4
        with:
          name: 00631L-manual-report-${{ github.run_number }}
          path: reports/
          retention-days: 14
